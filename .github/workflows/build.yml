# Build the release image for arm64 (Pi) and amd64 (future server) on native runners,
# publish one multi-arch tag to GHCR, then verify it on a throwaway stack (fresh install,
# then a full deploy over it). The run summary prints the ref to deploy.
#
# Build time: docs and dev-only changes don't trigger this at all (paths below). A commit that
# changes deploy scripts but none of the image's inputs reuses the existing image (plan job)
# and only runs verify. The image keeps Frappe + ERPNext in their own cached layer, so a
# custom-app change rebuilds and uploads only a small layer.
#
# No secrets needed: GITHUB_TOKEN pushes to ghcr.io/<owner>/erp.
name: Build

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - images/**
      - apps.json
      - versions.env
      - .dockerignore
      - deploy/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild the image even if its inputs are unchanged
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # Hash everything the image is built from; skip the build if that image already exists.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      inputs_tag: ${{ steps.plan.outputs.inputs_tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image inputs
        id: plan
        env:
          FORCE: ${{ inputs.force_build || false }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erp"
          # deploy/frappe_docker is listed as the submodule commit (its entrypoint is copied in).
          hash="$(git ls-tree -r HEAD -- apps images apps.json versions.env .dockerignore deploy/frappe_docker | sha256sum | cut -c1-16)"
          tag="inputs-$hash"
          echo "inputs_tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != true ] && docker buildx imagetools inspect "$IMAGE:$tag" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::image inputs unchanged, reusing $IMAGE:$tag"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Read versions
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erp" >> "$GITHUB_ENV"
          echo "REPO_REV=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          grep -E '^(FRAPPE_REF|BUILD_IMAGE|BASE_IMAGE|CUSTOM_APP)=' versions.env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            FRAPPE_REF=${{ env.FRAPPE_REF }}
            CUSTOM_APP=${{ env.CUSTOM_APP }}
            REPO_REV=${{ env.REPO_REV }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REPO_REV }}
            erp.frappe.ref=${{ env.FRAPPE_REF }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # Layer cache in the registry (the GHA cache drops entries unused for 7 days, and
          # builds here are rare). A change only under apps/ skips the slow `bench init`.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Save digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: [plan, build]
    # Also runs when the build was skipped (plan found the image), not when it failed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.build == 'true'
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tag
        id: ref
        env:
          BUILT: ${{ needs.plan.outputs.build }}
          INPUTS_TAG: ${{ needs.plan.outputs.inputs_tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erp"
          TAG="${GITHUB_SHA::7}"
          if [ "$BUILT" = true ]; then
            cd "$RUNNER_TEMP/digests"
            docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:main" -t "$IMAGE:$INPUTS_TAG" \
              $(printf "$IMAGE@sha256:%s " *)
          else
            docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:main" "$IMAGE:$INPUTS_TAG"
          fi
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "image_ref=$IMAGE:$TAG@$digest" >> "$GITHUB_OUTPUT"

  verify:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    # Same arch as the Pi.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.merge.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fresh install, then deploy over it
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          cat > deploy/env/ci.env <<EOF
          COMPOSE_PROJECT=erp-ci
          SITE_NAME=ci.localhost
          FRAPPE_SITE_NAME_HEADER=ci.localhost
          DB_PASSWORD=$(openssl rand -hex 16)
          COMPOSE_OVERRIDES=compose.pi.yaml
          PROXY=noproxy
          HTTP_PUBLISH_PORT=8080
          BACKUP_DIR=$RUNNER_TEMP/backups
          EOF
          df -h / | tee "$RUNNER_TEMP/verify.log"
          ADMIN_PASSWORD="$(openssl rand -hex 16)" deploy/deploy.sh init ci "$IMAGE_REF" 2>&1 | tee -a "$RUNNER_TEMP/verify.log"
          # Like the Pi's first deploy: the site lacks the custom app and the sites volume still
          # has an older apps.txt without it. deploy must fix both.
          app="$(sed -n 's/^CUSTOM_APP=//p' versions.env)"
          deploy/dc ci exec -T backend bench --site ci.localhost uninstall-app "$app" --yes --no-backup
          deploy/dc ci exec -T backend bash -c "grep -vx $app sites/apps.txt > /tmp/apps.txt; cp /tmp/apps.txt sites/apps.txt"
          deploy/deploy.sh deploy ci "$IMAGE_REF" 2>&1 | tee -a "$RUNNER_TEMP/verify.log"
          deploy/dc ci exec -T backend bench --site ci.localhost list-apps | grep "^$app\b"

      - name: Frontend and custom assets
        run: |
          deploy/dc ci exec -T frontend nginx -t
          curl -fsS -o /dev/null http://localhost:8080/api/method/ping
          deploy/dc ci exec -T backend bash -ec '
            f=$(python3 -c "import json; print(json.load(open(\"sites/assets/assets.json\"))[\"$1.bundle.css\"])")
            curl -fsS -o /dev/null http://frontend:8080$f && echo "served $f"
            for font in $(ls apps/$1/$1/public/fonts/*.woff2); do
              curl -fsS -o /dev/null "http://frontend:8080/assets/$1/fonts/$(basename $font)" && echo "served $(basename $font)"
            done
          ' _ "$(sed -n 's/^CUSTOM_APP=//p' versions.env)"

      - name: Logs on failure
        if: failure()
        run: |
          deploy/dc ci ps -a || true
          deploy/dc ci logs --tail 200 || true
          # Also as annotations: those are readable without logging in to GitHub.
          annotate() { python3 -c 'import sys; t=sys.stdin.read()[-3500:]; print("::error title=" + sys.argv[1] + "::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "$1"; }
          tr '\r' '\n' < "$RUNNER_TEMP/verify.log" | grep -v '^\s*$' | grep -v 'Updating DocTypes' | tail -40 | annotate "verify output" || true
          { df -h /; docker system df; deploy/dc ci ps -a; } 2>&1 | annotate "disk and containers" || true
          deploy/dc ci logs --tail 15 db backend 2>&1 | annotate "db and backend logs" || true

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "$IMAGE_REF"
            echo '```'
            echo "Deploy on the Pi:"
            echo '```'
            echo "deploy/deploy.sh deploy pi $IMAGE_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
