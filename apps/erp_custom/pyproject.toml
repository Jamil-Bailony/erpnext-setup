[project]
name = "erp_custom"
authors = [
    { name = "Jamil Bailony", email = "jBailony@outlook.com"}
]
description = "Our ERPNext customisations: UI, fonts, and anything else site-specific"
requires-python = ">=3.14"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
